name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

permissions:
  contents: read # for actions/checkout

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ghc:
          - '9.12'
          - '9.14'

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: haskell-actions/setup@v2.12.1
        id: setup-haskell
        with:
          ghc-version: ${{ matrix.ghc }}

      - name: Freeze dependencies
        run: cabal freeze

      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: build-${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            build-${{ runner.os }}-${{ matrix.ghc }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxft-dev libxinerama-dev libxrandr-dev libxss-dev

      - name: Install a xmonad command
        run: cabal install --overwrite-policy=always --jobs xmonad

      - name: Deploy the xmonad config
        run: |
          mkdir -p ~/.config
          ln -s "$PWD" ~/.config/xmonad

      - name: Build my xmonad executable
        run: xmonad --recompile

  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: tfausak/ormolu-setup-action@v1

      - name: Run ormolu
        run: |
          # shellcheck disable=SC2046
          ormolu --mode check $(git ls-files '*.hs')

  cabal-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: tfausak/cabal-gild-setup-action@v2

      - name: Run cabal-gild
        run: |
          cabal-gild xmonad-config.cabal
          git diff --exit-code

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: haskell-actions/hlint-setup@v2.4.10

      - uses: haskell-actions/hlint-run@v2.4.10
        with:
          fail-on: status

  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: |
          shellcheck \
            bin/xcapture \
            hooks \
            ;

  actionlint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
